[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#151E32"
codeBackgroundColor = "#151E32"
textColor = "#E2E8F0"
linkColor = "#818CF8"
borderColor = "#26324A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontSizes = ["32px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "1.5rem"

greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

chartCategoricalColors = ["#818CF8", "#34D399", "#F472B6", "#FBBF24", "#38BDF8", "#FB923C", "#94A3B8"]

dataframeBorderColor = "#26324A"
dataframeHeaderBackgroundColor = "#151E32"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#0E1527"
secondaryBackgroundColor = "#151E32"
codeBackgroundColor = "#151E32"
textColor = "#E2E8F0"
borderColor = "#26324A"
primaryColor = "#6366F1"
linkColor = "#818CF8"
